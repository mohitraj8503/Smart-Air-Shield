name: SMART AIR-SHIELD CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  firmware:
    name: Firmware Native Tests & ESP32 Compilation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Run Native Unit Tests
        working-directory: firmware
        run: |
          pio test -e native

      - name: Build ESP32 Firmware Target
        working-directory: firmware
        run: |
          pio run -e esp32dev

  dashboard:
    name: Next.js Companion Dashboard Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package.json

      - name: Install Dependencies
        working-directory: dashboard
        run: |
          npm install

      - name: Build Next.js Dashboard
        working-directory: dashboard
        run: |
          npm run build
